[pytest]
; A raiz do repo precisa estar no path para importar "scrap_do_pdf"
; (parser externo, tratado como dependência já existente).
; "backend" precisa estar no path para importar o pacote "app".
pythonpath = . backend
testpaths = tests
; tests/run_test.py é um script de diagnóstico manual (usa sys.argv), não
; uma suíte pytest — sem o "*_test.py" no padrão de coleta, ele deixa de
; ser confundido com um módulo de teste.
python_files = test_*.py
